name: Deploy to GitHub Pages

# Pages used to serve the repository root as plain files, which worked while the
# app was static HTML. Since the Vite rewrite the root holds sources — the entry
# point references /src/main.tsx, which a browser cannot run — so the site has to
# be built before it is published.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always publish the newest release commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly the lockfile, so a deploy cannot pick up a
      # dependency version that was never tested here. --legacy-peer-deps
      # matches the install command CLAUDE.md documents.
      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
